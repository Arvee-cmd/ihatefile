# Local full stack: API on :8000. Run the frontend with `pnpm dev` (it proxies /api to the API).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8000:8000"]   # local only; put a TLS reverse proxy in front for public use
    environment:
      IHATEFILE_CORS_ORIGINS: "http://localhost:5173,http://localhost:4173"
    # Optional hardening: no writes outside the temp dir, no new privileges.
    read_only: true
    tmpfs: ["/tmp:size=1g"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: 2g
